<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080c18;
  color:white;
}

.app{
  max-width:720px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

header{
  padding:16px;
  background:#10172b;
  border-bottom:1px solid #26304d;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{
  margin:0;
  font-size:25px;
}

.status{
  color:#55e68a;
  font-size:12px;
  margin-top:4px;
}

#clear{
  background:transparent;
  color:white;
  border:1px solid #3b4868;
  padding:8px 10px;
  border-radius:9px;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:18px;
}

.msg{
  max-width:88%;
  padding:13px 15px;
  margin-bottom:12px;
  border-radius:16px;
  line-height:1.5;
  white-space:pre-wrap;
}

.nova{
  background:#18213b;
  margin-right:auto;
}

.user{
  background:#315bd6;
  margin-left:auto;
}

.typing{
  color:#9da9c7;
}

.input{
  display:flex;
  gap:8px;
  padding:12px;
  background:#10172b;
  border-top:1px solid #26304d;
}

#text{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:12px;
  border:1px solid #34405f;
  background:#080c18;
  color:white;
  outline:none;
}

#send{
  border:0;
  border-radius:12px;
  padding:0 17px;
  background:#315bd6;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1>🤖 NOVA AI</h1>
    <div class="status">● Online — Free Mode</div>
  </div>

  <button id="clear" onclick="clearChat()">Clear</button>
</header>

<div id="chat"></div>

<div class="input">
  <input id="text" placeholder="Ask NOVA anything..." autocomplete="off">
  <button id="send" onclick="send()">Send</button>
</div>

</div>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("text");

let history=JSON.parse(
  localStorage.getItem("novaHistory")||"[]"
);

function save(){
  localStorage.setItem(
    "novaHistory",
    JSON.stringify(history)
  );
}

function show(text,type,saveIt=true){

  const div=document.createElement("div");

  div.className="msg "+type;
  div.textContent=text;

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;

  if(saveIt){
    history.push({text,type});
    save();
  }
}

function load(){

  if(history.length===0){

    show(
`Hello! 👋

I'm NOVA AI.

I can help with:
• Math
• School
• Coding
• Writing
• Business
• Ideas
• Motivation
• General questions
• Time and dates

What would you like to do?`,
      "nova"
    );

    return;
  }

  history.forEach(x=>{
    show(x.text,x.type,false);
  });
}

function math(question){

  let x=question
    .toLowerCase()
    .replace(/what is/g,"")
    .replace(/calculate/g,"")
    .replace(/equals/g,"")
    .replace(/plus/g,"+")
    .replace(/minus/g,"-")
    .replace(/times/g,"*")
    .replace(/multiplied by/g,"*")
    .replace(/divided by/g,"/")
    .replace(/over/g,"/")
    .replace(/x/g,"*")
    .trim();

  if(!/^[0-9+\-*/().%\s]+$/.test(x))
    return null;

  try{

    const answer=Function(
      '"use strict";return ('+x+')'
    )();

    if(Number.isFinite(answer))
      return "🧮 The answer is "+answer;

  }catch(e){}

  return null;
}

function response(q){

  const t=q.toLowerCase().trim();

  /* GREETINGS */

  if(/^(hi|hello|hey|yo|sup)$/.test(t))
    return "Hey! 👋 I'm NOVA. What's up?";

  if(t.includes("good morning"))
    return "Good morning! ☀️ Ready to build something today?";

  if(t.includes("good night"))
    return "Good night! 🌙 Keep moving toward your goals.";

  /* IDENTITY */

  if(t.includes("who are you"))
    return "I'm NOVA AI 🤖 — a free browser-based assistant you're building.";

  if(t.includes("your name"))
    return "My name is NOVA. 🚀";

  if(t.includes("are you real"))
    return "I'm software running in your browser. I'm not a human, but I'm here to help.";

  /* TIME */

  if(t.includes("time"))
    return "🕐 Your device time is "+new Date().toLocaleTimeString();

  if(t.includes("date"))
    return "📅 Today's date is "+new Date().toLocaleDateString();

  /* MATH */

  if(
    t.includes("calculate")||
    t.includes("what is")||
    /^[0-9+\-*/().%\s]+$/.test(t)
  ){

    const m=math(q);

    if(m)return m;
  }

  /* SCHOOL */

  if(
    t.includes("homework")||
    t.includes("school")||
    t.includes("study")||
    t.includes("exam")
  )
    return `📚 Study mode activated.

Send me the exact question you're working on.

I can help break a problem into smaller steps so you can understand it.`;

  /* MATH SUBJECT */

  if(
    t.includes("algebra")||
    t.includes("equation")||
    t.includes("geometry")
  )
    return `🧮 Math mode.

Send me the exact problem.

Example:
2x + 5 = 15

I'll show you the steps.`;

  /* CODING */

  if(
    t.includes("code")||
    t.includes("coding")||
    t.includes("javascript")||
    t.includes("html")||
    t.includes("css")||
    t.includes("website")
  )
    return `💻 Coding mode activated.

I can help you build websites and learn HTML, CSS and JavaScript.

Tell me what you want NOVA or another website to do.`;

  /* BUSINESS */

  if(
    t.includes("business")||
    t.includes("entrepreneur")||
    t.includes("startup")||
    t.includes("make money")
  )
    return `💼 Business mode.

A simple approach:

1. Find a problem.
2. Find people who have that problem.
3. Create a small solution.
4. Test whether people will pay.
5. Improve it using feedback.

Start small and learn as you go.`;

  /* MONEY */

  if(
    t.includes("money")||
    t.includes("rich")||
    t.includes("wealth")
  )
    return `💰 Money mode.

Focus on three things:

• Learn valuable skills.
• Solve problems people will pay for.
• Save and reinvest part of what you earn.

Avoid promises of "quick guaranteed money."`;

  /* WRITING */

  if(
    t.includes("write")||
    t.includes("essay")||
    t.includes("paragraph")||
    t.includes("rewrite")
  )
    return `✍️ Writing mode.

Tell me:

• What you're writing
• Who it's for
• The style you want

For example:
"Write a friendly message to my friend."`;

  /* IDEAS */

  if(
    t.includes("idea")||
    t.includes("ideas")||
    t.includes("brainstorm")
  )
    return `💡 Idea mode.

Try this:

Pick a problem → think of 10 possible solutions → choose one → build the smallest version → test it.

Tell me the topic and I'll help brainstorm.`;

  /* MOTIVATION */

  if(
    t.includes("motivat")||
    t.includes("give up")||
    t.includes("sad")||
    t.includes("tired")
  )
    return `💪 Keep going.

You don't need to solve your whole future today.

Take one useful step, learn from it, then take the next one.`;

  /* FRIENDSHIP */

  if(
    t.includes("friend")||
    t.includes("friendship")
  )
    return `🤝 Friendship mode.

Good friendships usually need honesty, respect, communication and time.

Tell me what happened and I'll help you think through it.`;

  /* CONVERSATION */

  if(
    t.includes("bored")||
    t.includes("fun")
  )
    return `😎 Let's fix that.

We could:
• Brainstorm a business
• Build NOVA
• Learn coding
• Try a math challenge
• Create a game idea
• Plan a project`;

  /* THANKS */

  if(
    t.includes("thank")||
    t==="thanks"
  )
    return "You're welcome! 😎🚀";

  /* HELP */

  if(
    t==="help"||
    t.includes("what can you do")
  )
    return `🤖 Here's what I can currently help with:

🧮 Math
📚 School
💻 Coding
💼 Business
💰 Money ideas
✍️ Writing
💡 Brainstorming
💪 Motivation
🤝 Friendship
🕐 Time/date
💬 Conversation

Try asking me something.`;

  /* DEFAULT */

  return `I hear you. 👂

You said:
"${q}"

I'm running in free offline mode, so I don't have the full knowledge and reasoning of a cloud AI yet.

Try asking about math, coding, school, business, writing, ideas, motivation or NOVA itself.`;
}

function send(){

  const q=input.value.trim();

  if(!q)return;

  show(q,"user");

  input.value="";

  const typing=document.createElement("div");

  typing.id="typing";
  typing.className="msg nova typing";
  typing.textContent="NOVA is thinking...";

  chat.appendChild(typing);
  chat.scrollTop=chat.scrollHeight;

  setTimeout(()=>{

    typing.remove();

    show(response(q),"nova");

  },500);
}

function clearChat(){

  localStorage.removeItem("novaHistory");

  history=[];

  chat.innerHTML="";

  show(
    "Chat cleared. 🧹\n\nHello again! I'm NOVA. What should we work on?",
    "nova"
  );
}

input.addEventListener("keydown",e=>{

  if(e.key==="Enter")
    send();

});

load();

</script>

</body>
</html>
